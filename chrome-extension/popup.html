<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hush Meeting Copilot</title>
  <style>
    :root {
      --bg: #0B1020;
      --panel: #121A2E;
      --line: #223052;
      --ink: #E7ECF6;
      --mute: #8D9AB5;
      --orange: #FF9900;
      --green: #34D399;
      --red: #F87171;
      --amber: #FBBF24;
      --blue: #60A5FA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 380px;
      min-height: 500px;
      background: var(--bg);
      color: var(--ink);
      font: 14px 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--mute);
      transition: all 0.3s;
    }

    .status-dot.active {
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
    }

    .status-dot.error {
      background: var(--red);
      box-shadow: 0 0 12px var(--red);
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 12px;
      color: var(--mute);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-start {
      background: var(--green);
      color: #111;
    }

    .btn-start:hover:not(:disabled) {
      background: #2BC788;
    }

    .btn-stop {
      background: var(--red);
      color: white;
    }

    .btn-stop:hover:not(:disabled) {
      background: #E85D5D;
    }

    .btn-secondary {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #1A2540;
    }

    .status-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
    }

    .status-row:last-child {
      border-bottom: none;
    }

    .status-label {
      color: var(--mute);
    }

    .status-value {
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .status-value.active {
      color: var(--green);
    }

    .status-value.inactive {
      color: var(--mute);
    }

    .status-value.error {
      color: var(--red);
    }

    .alert {
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-error {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid var(--red);
      color: var(--red);
    }

    .alert-info {
      background: rgba(96, 165, 250, 0.1);
      border: 1px solid var(--blue);
      color: var(--blue);
    }

    .alert-success {
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid var(--green);
      color: var(--green);
    }

    .settings {
      margin-top: 8px;
    }

    .input-group {
      margin-bottom: 10px;
    }

    .input-label {
      display: block;
      font-size: 12px;
      color: var(--mute);
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--blue);
    }

    .decision-preview {
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
    }

    .decision-item {
      padding: 8px;
      background: var(--bg);
      border-radius: 6px;
      margin-bottom: 6px;
      border-left: 3px solid var(--green);
    }

    .decision-item.guide {
      border-left-color: var(--amber);
    }

    .decision-item.deny {
      border-left-color: var(--red);
    }

    .decision-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .decision-tool {
      font-weight: 600;
      font-size: 11px;
    }

    .decision-verdict {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--line);
      text-transform: uppercase;
    }

    .decision-details {
      color: var(--mute);
      font-size: 11px;
      line-height: 1.4;
    }

    .empty {
      color: var(--mute);
      font-size: 12px;
      text-align: center;
      padding: 20px;
    }

    .footer {
      text-align: center;
      color: var(--mute);
      font-size: 11px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .link {
      color: var(--blue);
      text-decoration: none;
    }

    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="status-dot" id="statusDot"></div>
    <h1>Hush Meeting Copilot</h1>
  </div>

  <div class="alert alert-error" id="errorAlert">
    <div id="errorMessage"></div>
  </div>

  <div class="alert alert-info" id="infoAlert">
    <div id="infoMessage"></div>
  </div>

  <div class="section">
    <div class="section-title">Capture Control</div>
    <div class="controls">
      <button class="btn-start" id="startBtn">▶ Start Capture</button>
      <button class="btn-stop" id="stopBtn" disabled>⏹ Stop Capture</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Status</div>
    <div class="status-info">
      <div class="status-row">
        <span class="status-label">Capturing</span>
        <span class="status-value inactive" id="capturingStatus">Inactive</span>
      </div>
      <div class="status-row">
        <span class="status-label">Captions Captured</span>
        <span class="status-value" id="captionCount">0</span>
      </div>
      <div class="status-row">
        <span class="status-label">Backend</span>
        <span class="status-value inactive" id="backendStatus">Disconnected</span>
      </div>
      <div class="status-row">
        <span class="status-label">Session ID</span>
        <span class="status-value" id="sessionId">—</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Recent Decisions</div>
    <div class="decision-preview" id="decisionPreview">
      <div class="empty">No decisions yet. Start capturing to see real-time Strands Decider 2B decisions.</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Settings</div>
    <div class="settings">
      <div class="input-group">
        <label class="input-label" for="backendUrl">Backend URL</label>
        <input type="text" id="backendUrl" placeholder="http://localhost:8501" value="http://localhost:8501">
      </div>
      <button class="btn-secondary" id="saveSettingsBtn">Save Settings</button>
      <button class="btn-secondary" id="openDashboardBtn" style="margin-top: 6px;">Open Dashboard</button>
    </div>
  </div>

  <div class="footer">
    Built with <a href="https://github.com/strands-labs/strands-decider" class="link" target="_blank">Strands Decider 2B</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
